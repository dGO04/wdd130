<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Diego Esquit">
    <meta name="description" content="This Website allows user to contact us for support">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact us | Splash: Rafting Company</title>
</head>

<body>
    <header>
        <nav>
            <img src="images/rafting-logo.png" alt="" width="100" height="100">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html" class="divide">About Us</a></li>
                <li><a href="trips.html" class="divide">Trips</a></li>
                <li><a href="contact.html" class="divide">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <section class="section1">
            <h1>Splash Rafting Company</h1>
            <p>177A Bleecker Street, Greenwich Village</p>
            <p>New York City, NY</p>
            <p>+1 678 136 7092</p>
            <p>info@splashrafting.com</p>
        </section>
        <section class="section2">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3023.522369593003!2d-74.0025575660736!3d40.72852990104516!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sgt!4v1780699662769!5m2!1ses-419!2sgt"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form action="">
                <div>
                    <label for="name" class="userinfo">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="usermail" class="userinfo">Email</label>
                    <input type="email" id="usermail" name="usermail"
                      placeholder="example@email.com" required>
                </div>

                <div class="msgpurpose">
                    <p>Message purpose</label>
                    <div class="multiopt">
                        <div>
                            <input type="radio" id="radio1" name="radioselection">
                            <label for="radio1">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="radio2" name="radioselection">
                            <label for="radio2">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="radio3" name="radioselection">
                            <label for="radio3">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="messagecont">Message</label>
                    <textarea name="messagecont" id="messagecont" placeholder="Type here"
                      rows="6"></textarea>
                </div>
                <div>
                    <input type="checkbox" name="subscribe" id="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="section3">
            <div>
                <h3>We Are Here to Serve You</h3>
                <div class="employees">
                    <figure>
                        <img src="images/employees/attuma-worker.jpg"
                          alt="Male Employee from Splash Rafting Company">
                        <figcaption>Manuel Portillo</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employees/namora-worker.jpg"
                          alt="Female Employee from Splash Rafting Company">
                        <figcaption>Abril Lopez</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employees/tenoch-worker.jpg"
                          alt="Male Manager from Splash Rafting Company">
                        <figcaption>Raul Martinez</figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p> 🌊 &copy; 2026 🌊 Splash: Rafting Company 🌊 Diego Esquit 🌊</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com" target="_blank"><img
                  src="images/footer-logos/instagram-logo.png" alt="Instagram Logo"></a>
            <a href="https://facebook.com" target="_blank"><img
                  src="images/footer-logos/facebook-logo.png" alt="Facebook Logo"></a>
            <a href="https://www.x.com" target="_blank"><img src="images/footer-logos/x-icon.png"
                  alt="X Logo"></a>
        </nav>
    </footer>

</body>

</html>
