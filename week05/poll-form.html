<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Form Activity - Diego Esquit</title>
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <main>

        <form action="">
            <div class="contactinfo">
                <legend>Contact Information</legend>
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </div>
            <div class="questions">
                <legend>Questions</legend>
                <div>
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="1">Chrome</option>
                        <option value="2">Safari</option>
                        <option value="3">Edge</option>
                        <option value="4">Brave</option>
                        <option value="5">Other</option>
                    </select>
                </div>
                <div>
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div>
                    <label for="feedback" class="textblock">List the places you have lived:</label>
                    <textarea name="feedback" id="feedback"
                      placeholder="Chiclayo Peru, Paris France, Rome Italy" rows="5"></textarea>
                </div>
            </div>
            <button type="submit">Submit Poll</button>

        </form>

    </main>

    <footer></footer>

</body>

</html>
