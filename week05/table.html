<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/table.css">
    <title>Table Page</title>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>Team</th>
                <th>Record</th>
                <th>Player Count</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Southern</td>
                <td>Parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td class="graybox">Catarina</td>
                <td class="graybox">49-24</td>
                <td class="graybox">10</td>
            </tr>
            <tr>
                <td rowspan="3">Western</td>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <td class="graybox">Acre</td>
                <td class="graybox">75-87</td>
                <td class="graybox">20</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total Players</th>
                <th>92</th>
            </tr>
        </tfoot>
    </table>


</body>

</html>
