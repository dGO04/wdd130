<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Quiz Form - Diego Esquit</title>
</head>

<body>

    <header>
        <div>
            <img src="images/checkbox-logo.png" alt="Black and white checkbox logo">
            <h1>Basic HTML and CSS Quiz</h1>
        </div>
    </header>

    <main>
        <form action="">
            <div>
                <h3>1.</h3>
                <label for="question1">What does the acronym HTML stand for?</label>
            </div>
            <input type="text" id="question1" name="question1" required>
            <div>
                <h3>2.</h3>
                <label for="question2">How do you set margin & padding to 0 for all elements in the
                    website?</label>
            </div>
            <textarea type="textarea" id="question2" name="question2" rows="4"></textarea>
            <h3>3.</h3>
            <label for="question3">Which is the right way to set a class for an element</label>
            </div>
            <select name="question3" id="question3">
                <option value="">class : 'element'</option>
                <option value="">class => 'element'</option>
                <option value="">class name = 'element'</option>
                <option value="">class = 'element'</option>
            </select>
            <div>
                <h3>4.</h3>
                <label for="question4">What is the tag name to combine a CSS file to an HTML
                    file</label>
            </div>
            <input type="text" id="question4" name="question4" required>
            <button>Submit Quiz</button>
        </form>

    </main>

    <footer></footer>

</body>

</html>
